plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
}
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}
version = mod_version
group = mod_group_id
repositories {
    // JEI 的 maven（仅编译期用到 api，运行期 JEI 是可选的）
    maven {
        name = "JEI"
        url = "https://maven.blamejared.com"
    }
}
base {
    archivesName = "alltheimbaium-${minecraft_version}"
}
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
        jvmArgument '--enable-preview'
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // 临时：自动进入既有存档，用于验证配方同步包能否编码
        programArguments.addAll '--quickPlaySingleplayer', '26_1_2'
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
}
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // JEI 是可选联动：只用 api 制品，不打进 jar、也不进运行时依赖
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // 临时：把 JEI 本体拉进开发运行时，用于复现 ATM11 里的配方同步场景
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:29.36.0.96"
}
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['--enable-preview']
    // 移植期一次看全所有报错，避免被 javac 默认的 100 条上限截断
    options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}



tasks.register('dumpCp') {
    def cp = project.sourceSets.main.runtimeClasspath.asPath
    doLast {
        new File('C:/Users/10177/IdeaProjects/alltheimbaium-26.1.2/cp.txt').text = cp
    }
}
